<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sphere Pool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" crossorigin href="./assets/index-BXvjmcSb.css">
</head>
<body>
  <div class="app">
    <header class="board">
      <div class="side you"><span class="tname" id="n0"></span><span class="score" id="s0">0</span></div>
      <div class="clock"><div class="t" id="clock">5:00</div><div class="h" id="half">1st half</div></div>
      <div class="side r them"><span class="tname" id="n1"></span><span class="score" id="s1">0</span></div>
    </header>
    <div class="stage">
      <canvas id="pool" aria-label="Top-down view of the sphere pool"></canvas>
      <div class="overlay" id="overlay" hidden></div>
    </div>
    <section class="panel" id="panel" aria-live="polite"></section>
    <div class="foot">
      <span><button class="mini" id="helpBtn">How to play</button></span>
      <span><button class="mini" id="autoBtn">Auto-pilot: off</button> <button class="mini" id="newBtn">New match</button></span>
    </div>
  </div>
  <div class="sheet" id="intro" hidden role="dialog" aria-modal="true" aria-labelledby="introTitle"></div>
</body>
